; RDR2 Controller Rumble - put this file next to RDR2DSXRumble.asi in the game folder.
; Changes are picked up while the game runs (within ~2 seconds).

[General]
Enabled=1
; 1 = no rumble while you play with keyboard/mouse
OnlyWithController=1
; 1 = no rumble while the game window isn't in focus (alt-tab)
MuteWhenUnfocused=1
; F11 opens the settings menu in game. 1 = the game pauses while it is open
MenuPausesGame=1
; 1 = look up the newest version on GitHub once per game start and show a short notice
CheckForUpdates=1
; 1 = rumble during cutscenes too (footsteps, horse, shots and gunfire nearby)
CutsceneRumble=1
; 1 = log every DSX packet to RDR2DSXRumble.log
Debug=0

[Rumble]
; Game   = through the game's vibration (SET_CONTROL_SHAKE) -> DSX virtual pad -> DualSense. Keep in-game vibration ON.
; Direct = drive the left/right motors of DSX's virtual DualShock 4 directly (left foot = left motor, etc.).
;          Use this if the Game backend feels too weak or flat.
; (Menus and the startup shot always use Direct, because the game's scripts aren't running there.)
Backend=Direct
; All values in percent (0 = off, 100 = default, up to 200)
Intensity=100
; How strongly soft effects are pushed down compared to strong ones (DSX makes weak rumble feel strong).
; 1.0 = linear, 2.0 = default (footsteps faint, gunshots full), higher = even bigger gap. 0.5 - 4.0
ResponseCurve=1.5
Footsteps=100
Horse=100
; 0 = no hoofbeats while the horse walks, only from a trot up
HorseWalk=1
Weapons=100
Reload=100
; click when you draw, switch or holster a weapon
WeaponSwitch=100
Damage=100
Landing=100
Vehicle=100
Heartbeat=100
; getting punched / landing a punch in a fistfight
Melee=100
; wading through water on foot or on horseback (rivers and creeks push even when you stand still), splash when jumping in
Water=100
; swimming strokes, muffled hum underwater
Swimming=100
; bites from dogs/wolves, bear and cougar mauls, bull/bison rams, and a bear roaring at you
Animals=100
; a door slamming into its frame next to you
Doors=100
; heaving a body onto your shoulder and setting it down
Carry=100
; scraping down a slope
Sliding=100
; heartbeat + pulsing lightbar below this health in percent
HeartbeatBelowHealth=20

[Menu]
; a tick on every button press in the start menu, pause menu, map, journal, catalogs and shops
ButtonRumble=1
Intensity=100

[Startup]
; rumble for the gunshot in the startup splash, detected from the game's own sound
SplashShotRumble=1
; how loud (in % of full scale) a sudden sound must be to count as the shot. Lower = more sensitive.
; With Debug=1 the log shows the peaks, so you can tune this.
ShotThreshold=10
; only listen this many seconds after the game starts making sound (so the menu music won't trigger it)
WindowSeconds=30
Intensity=100

[DSX]
; DualSense only (adaptive triggers + lightbar). Xbox controllers need nothing here.
; DSX v3: Settings > Networking > enable "Incoming UDP" (default 127.0.0.1:6969)
Enabled=1
; 0 = auto (C:\Temp\DualSenseX\DualSenseX_PortNumber.txt, else 6969)
Port=0
ControllerIndex=0
; per-weapon trigger feel: revolver/pistol/repeater/rifle/sniper/shotgun click, bow draw, lasso tension
AdaptiveTriggers=1
; 1 = guns fire when R2 snaps over the trigger break (EXPERIMENTAL - currently stops guns from firing, keep 0)
FireAtBreakPoint=0
; move the firing point in % of the trigger travel (-30 to 30): negative = earlier, positive = later
BreakPointAdjust=0
; galloping vibration in both triggers while cantering/galloping (unarmed)
GallopingTriggersOnHorse=1
; lightbar colour follows health, flashes red on damage
Lightbar=1
